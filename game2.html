<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Escape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 90vh;
      border: 2px solid #3D3D6B;
      border-radius: 4px;
    }
    #back-link {
      margin-top: 12px;
      color: #9E9E9E;
      font-size: 13px;
      text-decoration: none;
    }
    #back-link:hover { color: #FFD600; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="480" height="640"></canvas>
  <a id="back-link" href="index.html">&larr; Back to Games</a>

  <script>
    // === CONSTANTS ===
    const W = 480, H = 640;
    const PLR_W = 40, PLR_H = 20;
    const PLR_BW = 36, PLR_BH = 16; // AABB (4px forgiveness each side)
    const MAX_OBS = 8;
    const WIN_TIME = 60; // seconds to fill progress bar
    const OBS_COLORS = ['#FF6D00', '#FF1744', '#E040FB'];

    // Difficulty bands [minSec, fallSpeed, spawnInterval, minR, maxR]
    const BANDS = [
      [0,  2.5, 50, 12, 22],
      [15, 3.5, 40, 14, 26],
      [30, 4.5, 32, 16, 30],
      [45, 5.5, 26, 18, 34],
      [60, 6.5, 22, 20, 38]
    ];

    // === STATE ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'start';
    let player, obstacles, lives, survivalTime, progress;
    let frameCount, spawnTimer, hitFlashTimer;
    let ctaPulse = 0;
    let lastTimestamp = 0;
    let dtAcc = 0; // seconds accumulated

    // === INPUT ===
    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if ((e.code === 'Space' || e.code === 'Enter') && gameState !== 'playing') startGame();
      if (e.code === 'KeyP' && gameState === 'playing') togglePause();
      if (gameState === 'playing') e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const tx = (touch.clientX - rect.left) * (W / rect.width);
      if (gameState !== 'playing') { startGame(); return; }
      if (tx < W / 2) { keys['ArrowLeft'] = true; keys['ArrowRight'] = false; }
      else { keys['ArrowRight'] = true; keys['ArrowLeft'] = false; }
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
    }, { passive: false });

    // === INIT ===
    function startGame() {
      gameState = 'playing';
      player = { x: W / 2 - PLR_W / 2, y: H - 50, inv: 0 };
      obstacles = [];
      lives = 3;
      survivalTime = 0;
      progress = 0;
      frameCount = 0;
      spawnTimer = 0;
      hitFlashTimer = 0;
      dtAcc = 0;
      lastTimestamp = performance.now();
    }

    function togglePause() {
      gameState = gameState === 'paused' ? 'playing' : 'paused';
    }

    // === DIFFICULTY ===
    function getDifficulty() {
      let band = BANDS[0];
      for (let i = BANDS.length - 1; i >= 0; i--) {
        if (survivalTime >= BANDS[i][0]) { band = BANDS[i]; break; }
      }
      return band;
    }

    // === SPAWN ===
    function spawnObstacle() {
      if (obstacles.length >= MAX_OBS) return;
      const band = getDifficulty();
      const minR = band[3], maxR = band[4];
      const r = minR + Math.random() * (maxR - minR);
      const speed = band[1] + (Math.random() - 0.5);
      const color = OBS_COLORS[Math.floor(Math.random() * OBS_COLORS.length)];
      // Ensure 40px gap from existing obstacles
      let x, tries = 0, ok = false;
      while (!ok && tries < 10) {
        x = r + Math.random() * (W - r * 2);
        ok = obstacles.every(o => Math.abs(o.x - x) >= 40);
        tries++;
      }
      obstacles.push({ x, y: -r, r, speed, color });
    }

    // === COLLISION — Circle vs AABB ===
    function circleHitsRect(cx, cy, cr, rx, ry, rw, rh) {
      const nearX = Math.max(rx, Math.min(cx, rx + rw));
      const nearY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearX, dy = cy - nearY;
      return dx * dx + dy * dy < cr * cr;
    }

    function checkCollisions() {
      if (player.inv > 0) return;
      const bx = player.x + (PLR_W - PLR_BW) / 2;
      const by = player.y + (PLR_H - PLR_BH) / 2;
      for (let obs of obstacles) {
        if (circleHitsRect(obs.x, obs.y, obs.r, bx, by, PLR_BW, PLR_BH)) {
          lives--;
          player.inv = 90;
          hitFlashTimer = 10;
          if (lives <= 0) { gameState = 'lose'; }
          return;
        }
      }
    }

    // === UPDATE ===
    function update(dt) {
      frameCount++;
      survivalTime += dt;
      progress = Math.min(100, (survivalTime / WIN_TIME) * 100);
      if (progress >= 100) { gameState = 'win'; return; }

      const band = getDifficulty();

      // Move player
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= 5;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += 5;
      player.x = Math.max(0, Math.min(W - PLR_W, player.x));

      // Spawn (frame-based for determinism)
      spawnTimer++;
      if (spawnTimer >= band[2]) { spawnObstacle(); spawnTimer = 0; }

      // Move obstacles
      for (let obs of obstacles) obs.y += obs.speed;
      obstacles = obstacles.filter(o => o.y - o.r < H + 20);

      // Invincibility
      if (player.inv > 0) player.inv--;
      if (hitFlashTimer > 0) hitFlashTimer--;

      // Collisions
      checkCollisions();
    }

    // === DRAWING ===
    function drawBackground() {
      // Gradient from danger-red at top to dark navy at bottom
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1A0A0A');
      grad.addColorStop(1, '#1A1A2E');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function drawObstacles() {
      for (let obs of obstacles) {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fillStyle = obs.color;
        ctx.fill();
        // Darker outline
        ctx.strokeStyle = shadeColor(obs.color, -40);
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function shadeColor(hex, amount) {
      let r = parseInt(hex.slice(1, 3), 16) + amount;
      let g = parseInt(hex.slice(3, 5), 16) + amount;
      let b = parseInt(hex.slice(5, 7), 16) + amount;
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));
      return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
    }

    function drawPlayer() {
      if (player.inv > 0 && Math.floor(player.inv / 8) % 2 === 0) return;
      ctx.fillStyle = '#2979FF';
      ctx.fillRect(player.x, player.y, PLR_W, PLR_H);
      ctx.strokeStyle = '#1A54C4';
      ctx.lineWidth = 2;
      ctx.strokeRect(player.x, player.y, PLR_W, PLR_H);
    }

    function drawHUD() {
      // Lives (shield icons using rectangles)
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('SHIELDS:', 10, 22);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < lives ? '#2979FF' : '#3D3D6B';
        ctx.fillRect(78 + i * 22, 8, 14, 16);
        if (i < lives) {
          ctx.fillStyle = '#5B9AFF';
          ctx.fillRect(81 + i * 22, 11, 4, 10); // highlight
        }
      }
      // Timer
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 14px Arial';
      const tStr = Math.min(WIN_TIME, Math.floor(survivalTime)) + 's / 60s';
      ctx.fillText(tStr, W / 2 - ctx.measureText(tStr).width / 2, 22);
      // Progress bar
      const barW = W - 20, barH = 12;
      const barX = 10, barY = 30;
      ctx.fillStyle = '#3D3D6B';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#00C853';
      ctx.fillRect(barX, barY, barW * (progress / 100), barH);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 10px Arial';
      const pStr = Math.floor(progress) + '%';
      ctx.fillText(pStr, barX + barW / 2 - ctx.measureText(pStr).width / 2, barY + 9);
      // Touch hint
      ctx.fillStyle = '#3D3D6B';
      ctx.font = '11px Arial';
      ctx.fillText('< TAP LEFT / RIGHT >', W / 2 - 58, H - 8);
    }

    function drawHitFlash() {
      if (hitFlashTimer > 0) {
        ctx.fillStyle = 'rgba(255,23,68,0.15)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawStartScreen() {
      drawBackground();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 34px Arial';
      const t1 = 'VERTICAL ESCAPE';
      ctx.fillText(t1, W / 2 - ctx.measureText(t1).width / 2, H / 2 - 80);
      ctx.fillStyle = '#9E9E9E';
      ctx.font = '15px Arial';
      const t2 = 'Dodge falling debris — survive 60 seconds';
      ctx.fillText(t2, W / 2 - ctx.measureText(t2).width / 2, H / 2 - 38);
      const t3 = '\u2190\u2192 Arrow Keys / A D to move   |   P to pause';
      ctx.fillText(t3, W / 2 - ctx.measureText(t3).width / 2, H / 2 - 12);
      ctaPulse += 0.05;
      ctx.fillStyle = `rgba(255,214,0,${0.6 + 0.4 * Math.sin(ctaPulse)})`;
      ctx.font = 'bold 14px Arial';
      const cta = 'PRESS SPACE OR TAP TO START';
      ctx.fillText(cta, W / 2 - ctx.measureText(cta).width / 2, H / 2 + 40);
    }

    function drawWinScreen() {
      drawBackground();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFD600';
      ctx.font = 'bold 34px Arial';
      const t1 = 'ESCAPED!';
      ctx.fillText(t1, W / 2 - ctx.measureText(t1).width / 2, H / 2 - 60);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '17px Arial';
      const t2 = 'Survived: ' + Math.floor(survivalTime) + 's   Lives: ' + lives;
      ctx.fillText(t2, W / 2 - ctx.measureText(t2).width / 2, H / 2 - 10);
      ctaPulse += 0.05;
      ctx.fillStyle = `rgba(255,214,0,${0.6 + 0.4 * Math.sin(ctaPulse)})`;
      ctx.font = 'bold 14px Arial';
      const cta = 'PRESS SPACE OR TAP TO PLAY AGAIN';
      ctx.fillText(cta, W / 2 - ctx.measureText(cta).width / 2, H / 2 + 40);
    }

    function drawLoseScreen() {
      drawBackground();
      ctx.fillStyle = 'rgba(30,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FF1744';
      ctx.font = 'bold 34px Arial';
      const t1 = 'GAME OVER';
      ctx.fillText(t1, W / 2 - ctx.measureText(t1).width / 2, H / 2 - 60);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '17px Arial';
      const t2 = 'Survived ' + Math.floor(survivalTime) + 's of 60s';
      ctx.fillText(t2, W / 2 - ctx.measureText(t2).width / 2, H / 2 - 10);
      ctaPulse += 0.05;
      ctx.fillStyle = `rgba(255,214,0,${0.6 + 0.4 * Math.sin(ctaPulse)})`;
      ctx.font = 'bold 14px Arial';
      const cta = 'PRESS SPACE OR TAP TO TRY AGAIN';
      ctx.fillText(cta, W / 2 - ctx.measureText(cta).width / 2, H / 2 + 40);
    }

    function drawPauseOverlay() {
      ctx.fillStyle = 'rgba(26,26,46,0.80)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 30px Arial';
      const t = 'PAUSED';
      ctx.fillText(t, W / 2 - ctx.measureText(t).width / 2, H / 2);
      ctx.fillStyle = '#9E9E9E';
      ctx.font = '14px Arial';
      const s = 'Press P to resume';
      ctx.fillText(s, W / 2 - ctx.measureText(s).width / 2, H / 2 + 30);
    }

    function draw() {
      drawBackground();
      drawObstacles();
      drawPlayer();
      drawHUD();
      drawHitFlash();
    }

    // === GAME LOOP (timestamp-based for accurate time tracking) ===
    function gameLoop(timestamp) {
      requestAnimationFrame(gameLoop);
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50ms
      lastTimestamp = timestamp;
      ctx.clearRect(0, 0, W, H);
      switch (gameState) {
        case 'start':  drawStartScreen(); break;
        case 'playing': update(dt); draw(); break;
        case 'win':   drawWinScreen(); break;
        case 'lose':  drawLoseScreen(); break;
        case 'paused': draw(); drawPauseOverlay(); break;
      }
    }

    // === BOOT ===
    requestAnimationFrame(ts => { lastTimestamp = ts; requestAnimationFrame(gameLoop); });
  </script>
</body>
</html>
